<!DOCTYPE html>

<html>

{% include head.html %}

{% assign page_body_class = page.body_class %}
<body{% if page.page_archetype or page_body_class %} class="{% if page.page_archetype %}jat-archetype-{{ page.page_archetype | escape }}{% endif %}{% if page_body_class %} {{ page_body_class | escape }}{% endif %}"{% endif %}{% if page.page_archetype %} data-page-archetype="{{ page.page_archetype | escape }}"{% endif %}>

  {% include navbar.html %}

  {{ content }}

  <link rel="stylesheet" href="{{ '/assets/css/jat-dark-pages.css' | relative_url }}">

  {% include footer.html %}

  {% include scripts.html %}

  {% include google-analytics.html %}

  {% if page.layout == 'post' %}
  <script id="jat-reader-page-data" type="application/json">
    {
      "url": {{ page.url | relative_url | jsonify }},
      "title": {{ page.title | jsonify }},
      "categories": {{ page.categories | jsonify }},
      "tags": {{ page.tags | jsonify }},
      "collections": {{ page.collections | jsonify }},
      "scripture": {{ page.scripture | default: '' | jsonify }}
    }
  </script>
  <script src="{{ '/assets/js/reader-profile.js' | relative_url }}"></script>
  {% endif %}

</body>

</html>

name: Migrate January 2026 metadata

on:
  push:
    branches:
      - content-architecture-v1-1
    paths:
      - .github/workflows/migrate-january-2026.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content-architecture-v1-1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML support
        run: python -m pip install PyYAML

      - name: Migrate January posts
        run: python .github/scripts/migrate_january_2026.py

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate January 2026 metadata"
          git push origin HEAD:content-architecture-v1-1

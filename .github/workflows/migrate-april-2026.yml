name: Migrate April 2026 metadata

on:
  push:
    branches:
      - content-architecture-v1-1
    paths:
      - .github/workflows/migrate-april-2026.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content-architecture-v1-1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML support
        run: python -m pip install PyYAML
      - name: Migrate April posts
        run: python .github/scripts/migrate_april_2026.py
      - name: Validate migrated front matter
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          files = sorted(Path('_posts').glob('2026-04-*.md'))
          assert len(files) == 4, len(files)
          for path in files:
              text = path.read_text(encoding='utf-8')
              _, front, body = text.split('---', 2)
              data = yaml.safe_load(front)
              assert data['categories'] == ['reflection']
              assert data.get('collections')
              assert isinstance(data.get('tags'), list)
              assert data.get('series') == 'Known & Loved'
              assert isinstance(data.get('series_order'), int)
              if 'scripture' in data:
                  assert isinstance(data['scripture'], list)
              assert '<!--stackedit_data:' not in body
          PY
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate April 2026 metadata"
          git push origin HEAD:content-architecture-v1-1

name: Migrate February 2026 metadata

on:
  push:
    branches: [content-architecture-v1-1]
    paths: [.github/workflows/migrate-february-2026.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML support
        run: pip install pyyaml
      - name: Migrate February posts
        shell: python
        run: |
          import re, subprocess
          from pathlib import Path
          import yaml

          files = sorted(Path('_posts').glob('2026-02-*.md'))
          assert len(files) == 10, f'Expected 10 February posts, found {len(files)}'

          classification = {
            '2026-02-02-when-understanding-changes-the-question.md': ('reflection', ['technology', 'culture']),
            '2026-02-04-The-Dysangelion-of-Judas.md': ('reflection', ['faith']),
            '2026-02-06-wisdom-in-the-age-of-algorithms.md': ('reflection', ['faith', 'technology', 'leadership']),
            '2026-02-13-The-God-Who-Sees-the-Hidden-Work.md': ('reflection', ['faith', 'technology', 'leadership']),
            '2026-02-16-The-Road-Between-Confusion-and-Clarity.md': ('bible-study', ['faith']),
            '2026-02-18-Driving-Through-the-Fog.md': ('reflection', ['faith', 'creation']),
            '2026-02-20-The-Quiet-Replacement.md': ('reflection', ['faith', 'technology', 'leadership']),
            '2026-02-23-Bite-the-Bagel.md': ('reflection', ['faith', 'leadership', 'marriage']),
            '2026-02-25-The-Paradox-of-Pain.md': ('devotional', ['faith']),
            '2026-02-27-The-Servant-Not-the-Shepherd.md': ('reflection', ['faith', 'technology', 'leadership']),
          }

          tag_aliases = {
            'ai': 'artificial-intelligence', 'notebooklm': 'notebooklm',
            'spiritual growth': 'spiritual-growth', 'hidden work': 'hidden-work',
            'progressive revelation': 'progressive-revelation', 'mark 8': 'mark-8',
            'emotional maturity': 'emotional-maturity', 'self awareness': 'self-awareness',
            'hebrews 12': 'hebrews-12', 'judas': 'judas-iscariot',
            'formation': 'spiritual-formation', 'leadership': 'servant-leadership',
          }

          def split_frontmatter(text):
            m = re.match(r'^---\s*\n(.*?)\n---\s*\n?', text, re.S)
            if not m:
              raise ValueError('Missing front matter')
            return yaml.safe_load(m.group(1)) or {}, text[m.end():]

          def normalize_tag(value):
            s = str(value).strip().lower()
            s = tag_aliases.get(s, s)
            s = re.sub(r'[^a-z0-9]+', '-', s).strip('-')
            return s

          def scripture_list(value):
            if not value:
              return []
            items = value if isinstance(value, list) else re.split(r';\s*', str(value))
            out = []
            for item in items:
              item = re.sub(r'\s+(ESV|NIV|KJV|NKJV|CSB|NASB|LSB|NLT)$', '', str(item).strip(), flags=re.I)
              item = item.replace('–', '-')
              if item and item not in out:
                out.append(item)
            return out

          order = ['layout','title','subtitle','description','date','author','contributors','categories','collections','tags','excerpt','image','background','scripture','series','series_order']

          for path in files:
            source = subprocess.check_output(['git','show',f'origin/master:{path.as_posix()}'], text=True)
            meta, body = split_frontmatter(source)
            article_type, collections = classification[path.name]
            meta['date'] = path.name[:10]
            meta['categories'] = [article_type]
            meta['collections'] = collections
            tags = []
            for tag in meta.get('tags') or []:
              tag = normalize_tag(tag)
              if tag and tag not in tags and tag not in collections:
                tags.append(tag)
            meta['tags'] = tags
            refs = scripture_list(meta.get('scripture'))
            if refs: meta['scripture'] = refs
            else: meta.pop('scripture', None)
            meta.pop('header-image', None)
            for key in ['subtitle','description','excerpt','contributors','series']:
              if key in meta and (meta[key] is None or meta[key] == '' or meta[key] == []):
                meta.pop(key)
            if 'series' not in meta:
              meta.pop('series_order', None)
            body = re.sub(r'\n?<!--stackedit_data:.*?-->\s*$', '', body, flags=re.S).rstrip() + '\n'
            ordered = {k: meta[k] for k in order if k in meta}
            ordered.update({k:v for k,v in meta.items() if k not in ordered})
            front = yaml.safe_dump(ordered, sort_keys=False, allow_unicode=True, width=1000).strip()
            path.write_text(f'---\n{front}\n---\n\n{body}', encoding='utf-8')

          subprocess.run(['git','diff','--check'], check=True)
          subprocess.run(['git','status','--short'], check=True)
      - name: Commit migration
        run: |
          rm .github/workflows/migrate-february-2026.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _posts/2026-02-*.md .github/workflows/migrate-february-2026.yml
          git commit -m 'Migrate February 2026 metadata'
          git push

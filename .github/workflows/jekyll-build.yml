name: Jekyll build

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      - name: Upload rendered site files
        uses: actions/upload-artifact@v4
        with:
          name: rendered-site
          path: |
            _site/**/*.html
            _site/assets/**/*.css
            _site/assets/**/*.js
          if-no-files-found: error
          retention-days: 7

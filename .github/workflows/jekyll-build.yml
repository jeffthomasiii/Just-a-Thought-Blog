name: Jekyll build

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - content-architecture-v1-1
      - curated-library-v1
      - explore-library-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply final validation corrections
        if: github.ref_name == 'content-architecture-v1-1'
        run: python .github/scripts/fix_final_validation_findings.py

      - name: Apply release candidate visual fixes
        if: github.ref_name == 'content-architecture-v1-1'
        run: python .github/scripts/fix_rc_visual_findings.py

      - name: Commit validation corrections
        if: github.ref_name == 'content-architecture-v1-1'
        run: |
          if git diff --quiet; then
            echo "No validation corrections required."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _posts assets _includes
            git commit -m "Correct final release candidate findings"
            git push origin content-architecture-v1-1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install metadata validator dependencies
        run: python -m pip install PyYAML

      - name: Validate content repository
        run: python .github/scripts/validate_content_repository.py

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      - name: Upload rendered site files
        uses: actions/upload-artifact@v4
        with:
          name: rendered-site
          path: |
            _site/**/*.html
            _site/assets/**/*.css
            _site/assets/**/*.js
            _site/search.json
            _site/img/bg-about.jpg
            _site/img/jat-olive-branch.png
            _site/img/pages/bg-podcast-coming-soon.jpg
            _site/img/pages/podcast-episode-preview.jpg
            _site/img/pages/resources-hero.jpg
            _site/img/pages/resources-bible-study-framework.jpg
            _site/img/pages/resources-from-aleph-to-tav.jpg
            _site/img/pages/resources-design-principle.jpg
            _site/img/posts/can-you-love-without-knowing.jpg
            _site/img/posts/wisdom-in-the-age-of-algorithms.jpg
            _site/img/posts/lead-like-this-intro.jpg
            _site/img/posts/10-skills-every-man.jpg
            _site/img/posts/paul-context.jpg
            _site/img/posts/you-cant-fake-care.jpg
            _site/img/posts/the-cycle-we-dont-see.jpg
            _site/img/posts/you-him-and-i.jpg
          if-no-files-found: error
          retention-days: 7

name: Jekyll build

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      - name: Upload rendered site files
        uses: actions/upload-artifact@v4
        with:
          name: rendered-site
          path: |
            _site/**/*.html
            _site/assets/**/*.css
            _site/assets/**/*.js
            _site/search.json
            _site/img/bg-about.jpg
            _site/img/jat-olive-branch.png
            _site/img/pages/bg-podcast-coming-soon.jpg
            _site/img/pages/podcast-episode-preview.jpg
            _site/img/posts/can-you-love-without-knowing.jpg
            _site/img/posts/wisdom-in-the-age-of-algorithms.jpg
            _site/img/posts/lead-like-this-intro.jpg
            _site/img/posts/10-skills-every-man.jpg
            _site/img/posts/paul-context.jpg
            _site/img/posts/you-cant-fake-care.jpg
            _site/img/posts/the-cycle-we-dont-see.jpg
            _site/img/posts/you-him-and-i.jpg
          if-no-files-found: error
          retention-days: 7

name: Finalize metadata migration

on:
  push:
    branches:
      - content-architecture-v1-1

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: content-architecture-v1-1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: pip install pyyaml

      - name: Validate metadata and update migration records
        run: python .github/scripts/finalize_metadata_migration.py

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Record successful build
        run: |
          python - <<'PY'
          from pathlib import Path
          report = Path('docs/migration/final-validation-report.md')
          text = report.read_text(encoding='utf-8').replace('- Pending workflow build step.', '- PASS: `bundle exec jekyll build` completed successfully.')
          report.write_text(text, encoding='utf-8')
          log = Path('docs/migration/migration-log.md')
          text = log.read_text(encoding='utf-8').replace('- [ ] Jekyll build verified', '- [x] Jekyll build verified')
          text = text.replace('| Validation | In Progress |', '| Validation | Complete |')
          log.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary validator
        run: |
          rm -f .github/scripts/finalize_metadata_migration.py
          rm -f .github/workflows/finalize-metadata-migration.yml

      - name: Commit final migration records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize metadata migration and validation'
          git push origin content-architecture-v1-1

name: Final content repository validation

on:
  push:
    branches:
      - content-architecture-v1-1
    paths:
      - '.github/scripts/validate_content_repository.py'
      - '.github/workflows/final-content-validation.yml'
      - '_posts/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '_config.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate post metadata and assets
        run: python .github/scripts/validate_content_repository.py

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

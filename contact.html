<p>Have a question, response, or thought to share? I’d be glad to hear from you. Use the form below to send a message, and I’ll respond when I’m able.</p>

<form action="https://formsubmit.co/jeff.thomas.iii@gmail.com" method="POST">
  <input type="hidden" name="_subject" value="New message from Just A Thought Blog">
  <input type="hidden" name="_next" value="https://justathoughtblog.org/thank-you.html">
  <input type="hidden" name="_captcha" value="false">

  <div class="form-group">
    <input type="text" name="name" class="form-control" placeholder="Name" required>
  </div>
  <div class="form-group">
    <input type="email" name="email" class="form-control" placeholder="Email Address" required>
  </div>
  <div class="form-group">
    <input type="tel" name="phone" class="form-control" placeholder="Phone Number">
  </div>
  <div class="form-group">
    <textarea name="message" rows="5" class="form-control" placeholder="Your Message" required></textarea>
  </div>
  <button type="submit" class="btn btn-primary">Send Message</button>
</form>

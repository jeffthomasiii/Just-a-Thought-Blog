<section class="jat-author-share" data-author-share hidden aria-labelledby="jat-author-share-title">
  <div class="jat-author-share__backdrop" data-author-share-close></div>
  <div class="jat-author-share__dialog" role="dialog" aria-modal="true">
    <button class="jat-author-share__close" type="button" data-author-share-close aria-label="Close social post creator">×</button>
    <p class="jat-author-share__eyebrow">Author tool</p>
    <h2 id="jat-author-share-title">Create social posts</h2>
    <p class="jat-author-share__intro">Choose where you want to share this article and the angle you want the captions to emphasize.</p>

    <div class="jat-author-share__grid">
      <fieldset>
        <legend>Platforms</legend>
        <label><input type="checkbox" value="facebook" checked> Facebook</label>
        <label><input type="checkbox" value="threads" checked> Threads</label>
        <label><input type="checkbox" value="linkedin" checked> LinkedIn</label>
        <label><input type="checkbox" value="x"> X</label>
        <label><input type="checkbox" value="instagram"> Instagram</label>
        <label><input type="checkbox" value="text-message"> Text message</label>
      </fieldset>

      <fieldset>
        <legend>Emphasis</legend>
        <label><input type="radio" name="jat-author-angle" value="general article announcement" checked> General announcement</label>
        <label><input type="radio" name="jat-author-angle" value="personal reflection"> Personal reflection</label>
        <label><input type="radio" name="jat-author-angle" value="faith and Scripture"> Faith and Scripture</label>
        <label><input type="radio" name="jat-author-angle" value="marriage and relationships"> Marriage and relationships</label>
        <label><input type="radio" name="jat-author-angle" value="leadership and professional application"> Leadership and professional</label>
        <label><input type="radio" name="jat-author-angle" value="a reflective question for readers"> Ask readers a question</label>
      </fieldset>
    </div>

    <div class="jat-author-share__article" data-author-article-preview></div>

    <div class="jat-author-share__actions">
      <label for="jat-author-ai">AI tool</label>
      <select id="jat-author-ai" data-author-ai-tool>
        <option value="https://chatgpt.com/">ChatGPT</option>
        <option value="https://claude.ai/new">Claude</option>
        <option value="https://gemini.google.com/app">Gemini</option>
        <option value="https://www.perplexity.ai/">Perplexity</option>
      </select>
      <button type="button" data-author-generate>Copy prompt &amp; open AI</button>
    </div>

    <details class="jat-author-share__import">
      <summary>Import the AI captions back into this page</summary>
      <p>Paste the JSON response from the AI here, then select <strong>Load captions</strong>.</p>
      <textarea data-author-import rows="7" placeholder='{"facebook":"...","threads":"..."}'></textarea>
      <button type="button" data-author-load>Load captions</button>
    </details>

    <div class="jat-author-share__results" data-author-results hidden></div>
    <p class="jat-author-share__status" data-author-status aria-live="polite"></p>
  </div>
</section>

<style>
  .jat-author-share{position:fixed;inset:0;z-index:10050;font-family:'Source Sans 3','Open Sans',sans-serif;color:#252822}
  .jat-author-share[hidden]{display:none!important}.jat-author-share__backdrop{position:absolute;inset:0;background:rgba(25,28,22,.72)}
  .jat-author-share__dialog{position:relative;width:min(880px,calc(100% - 2rem));max-height:calc(100vh - 2rem);overflow:auto;margin:1rem auto;padding:1.5rem;border:1px solid rgba(79,93,58,.25);border-radius:12px;background:#F6F1E7;box-shadow:0 24px 70px rgba(0,0,0,.28)}
  .jat-author-share__close{position:absolute;top:.7rem;right:.85rem;border:0;background:transparent;color:#7A7468;font-size:2rem;line-height:1;cursor:pointer}
  .jat-author-share__eyebrow{margin:0 0 .2rem;color:#4F5D3A;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
  .jat-author-share h2{margin:0 2rem .4rem 0;font-family:'Playfair Display','Lora',serif;font-size:2rem;color:#252822}.jat-author-share__intro{margin:0 0 1.2rem;color:#6f695f}
  .jat-author-share__grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.jat-author-share fieldset{margin:0;padding:1rem;border:1px solid rgba(79,93,58,.18);border-radius:8px;background:#fffdf9}.jat-author-share legend{padding:0 .3rem;color:#4F5D3A;font-weight:700}.jat-author-share label{display:block;margin:.45rem 0;cursor:pointer}.jat-author-share input{margin-right:.45rem}
  .jat-author-share__article{margin:1rem 0;padding:.85rem 1rem;border-left:3px solid #4F5D3A;background:rgba(255,253,249,.75);line-height:1.5}.jat-author-share__article strong{display:block;font-family:'Playfair Display','Lora',serif;font-size:1.12rem}
  .jat-author-share__actions{display:grid;grid-template-columns:auto minmax(150px,220px) auto;align-items:end;gap:.65rem}.jat-author-share__actions label{margin:0}.jat-author-share select,.jat-author-share textarea{width:100%;border:1px solid rgba(79,93,58,.35);border-radius:6px;background:#fffdf9;color:#252822;padding:.65rem}.jat-author-share button[data-author-generate],.jat-author-share button[data-author-load]{border:1px solid #4F5D3A;border-radius:6px;background:#4F5D3A;color:#F6F1E7;padding:.65rem .85rem;font-weight:700;cursor:pointer}
  .jat-author-share__import{margin-top:1rem;padding-top:.9rem;border-top:1px solid rgba(79,93,58,.16)}.jat-author-share__import summary{color:#4F5D3A;font-weight:700;cursor:pointer}.jat-author-share__import p{margin:.65rem 0;color:#6f695f}.jat-author-share__import button{margin-top:.55rem}
  .jat-author-share__results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.85rem;margin-top:1rem}.jat-author-share__card{padding:1rem;border:1px solid rgba(79,93,58,.18);border-radius:8px;background:#fffdf9}.jat-author-share__card h3{margin:0 0 .55rem;color:#4F5D3A;font-size:.82rem;text-transform:uppercase;letter-spacing:.07em}.jat-author-share__card textarea{min-height:180px;resize:vertical}.jat-author-share__card-actions{display:flex;gap:.7rem;margin-top:.55rem}.jat-author-share__card-actions button,.jat-author-share__card-actions a{border:0;background:transparent;color:#4F5D3A;padding:0;font-weight:700;text-decoration:none;cursor:pointer}.jat-author-share__status{min-height:1.4em;margin:.8rem 0 0;color:#6f695f}
  body.dark-mode .jat-author-share__dialog{background:#22251D;color:#F5F5F5;border-color:rgba(214,179,107,.22)}body.dark-mode .jat-author-share h2{color:#F5F5F5}body.dark-mode .jat-author-share__intro,body.dark-mode .jat-author-share__status,body.dark-mode .jat-author-share__import p{color:#C9C1B0}body.dark-mode .jat-author-share fieldset,body.dark-mode .jat-author-share__article,body.dark-mode .jat-author-share__card,body.dark-mode .jat-author-share select,body.dark-mode .jat-author-share textarea{background:#181a16;color:#F5F5F5;border-color:rgba(162,177,121,.35)}
  @media(max-width:700px){.jat-author-share__grid,.jat-author-share__results{grid-template-columns:1fr}.jat-author-share__actions{grid-template-columns:1fr}.jat-author-share__dialog{padding:1.2rem}}
</style>
